# Mencegah proyek Supabase (paket gratis) dijeda karena tidak aktif seminggu.
# Memanggil /api/health tiap 3 hari; endpoint itu membaca database.
# Alamat website diambil dari variabel repo SITE_URL (Settings → Secrets and variables → Actions → Variables).
name: Keep-alive Supabase

on:
  schedule:
    - cron: "17 3 */3 * *" # 03:17 UTC, tiap 3 hari
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Panggil /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Variabel repo SITE_URL belum diatur"
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 15 --max-time 60 "${SITE_URL%/}/api/health"
          echo
